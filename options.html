<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
    <title></title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body data-view="options">
    <main class="options-page">
      <header class="options-header">
        <div class="options-header-logo">
          <img src="icon-32.png" alt="">
        </div>
        <div>
          <h1 class="options-header-title" data-i18n-text="Bookmark Scope Settings"></h1>
          <p class="options-header-sub" data-i18n-text="Customize behavior, appearance, and matching rules."></p>
        </div>
      </header>

      <form id="settings-form">
        <section class="settings-section">
          <h2 class="section-title" data-i18n-text="Behavior defaults"></h2>
          <p class="section-copy" data-i18n-text="Set the baseline behavior so the popup stops making you repeat yourself."></p>
          <div class="settings-grid">
            <label class="field">
              <span class="field-label" data-i18n-text="Default mode"></span>
              <select id="default-mode"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n-text="Default sort"></span>
              <select id="default-sort"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n-text="Popup width"></span>
              <select id="popup-width"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n-text="Merge strategy"></span>
              <select id="merge-strategy"></select>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="section-title" data-i18n-text="Appearance and language"></h2>
          <p class="section-copy" data-i18n-text="Align the interface with your browser theme, preferred color, and language."></p>
          <div class="settings-grid">
            <label class="field">
              <span class="field-label" data-i18n-text="Theme"></span>
              <select id="theme-mode"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n-text="Color palette"></span>
              <select id="color-palette"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n-text="Language"></span>
              <select id="locale-preference"></select>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="section-title" data-i18n-text="URL matching rules"></h2>
          <p class="section-copy" data-i18n-text="Tighten matching when URLs are noisy so duplicate review stays accurate."></p>
          <div class="toggle-stack">
            <label class="checkbox-row setting-toggle">
              <input type="checkbox" id="ignore-query">
              <span>
                <strong class="field-label" data-i18n-text="Ignore query string in page matching"></strong>
                <small class="field-help" data-i18n-text="Treat tracking parameters as disposable clutter when matching pages."></small>
              </span>
            </label>
            <label class="checkbox-row setting-toggle">
              <input type="checkbox" id="ignore-hash">
              <span>
                <strong class="field-label" data-i18n-text="Ignore hash fragment in page matching"></strong>
                <small class="field-help" data-i18n-text="Useful when anchors change but the actual page does not."></small>
              </span>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="section-title" data-i18n-text="Scheduled health scan">Scheduled health scan</h2>
          <p class="section-copy" data-i18n-text="Let Bookmark Scope quietly check your links in the background. You'll get a notification when new broken links turn up.">Let Bookmark Scope quietly check your links in the background. You'll get a notification when new broken links turn up.</p>
          <div class="toggle-stack">
            <label class="checkbox-row setting-toggle">
              <input type="checkbox" id="bg-scan-enabled">
              <span>
                <strong class="field-label" data-i18n-text="Enable scheduled background scan">Enable scheduled background scan</strong>
                <small class="field-help" data-i18n-text="Requires permission to read your bookmarks' linked sites. Off by default.">Requires permission to read your bookmarks' linked sites. Off by default.</small>
              </span>
            </label>
          </div>
          <div class="settings-grid">
            <label class="field">
              <span class="field-label" data-i18n-text="Scan interval (days)">Scan interval (days)</span>
              <input type="number" id="bg-scan-interval" min="1" max="90" step="1">
            </label>
          </div>
          <p class="section-copy" id="bg-scan-status" data-i18n-text=""></p>
        </section>

        <section class="settings-section">
          <h2 class="section-title" data-i18n-text="Review reminders">Review reminders</h2>
          <p class="section-copy" data-i18n-text="Get a notification when it is time to look through your bookmarks again. Nothing is checked or changed automatically.">Get a notification when it is time to look through your bookmarks again. Nothing is checked or changed automatically.</p>
          <div class="toggle-stack">
            <label class="checkbox-row setting-toggle">
              <input type="checkbox" id="review-reminder-enabled">
              <span>
                <strong class="field-label" data-i18n-text="Enable review reminders">Enable review reminders</strong>
                <small class="field-help" data-i18n-text="Off by default. Uses notifications only; no site access is needed.">Off by default. Uses notifications only; no site access is needed.</small>
              </span>
            </label>
          </div>
          <div class="settings-grid">
            <label class="field">
              <span class="field-label" data-i18n-text="Reminder interval (days)">Reminder interval (days)</span>
              <input type="number" id="review-reminder-interval" min="1" max="365" step="1">
            </label>
          </div>
        </section>

        <section class="settings-section">
          <div class="actions">
            <button type="submit" class="button primary-button" data-i18n-text="Save settings"></button>
            <button type="button" id="reset-defaults" class="button ghost-button" data-i18n-text="Reset defaults"></button>
          </div>
          <div id="status" class="status" aria-live="polite"></div>
        </section>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
