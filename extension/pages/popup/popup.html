<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
    <title></title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="mini-app" id="app"></div>
    <!--
      footerConfig.js is an optional classic (non-module) script that can
      override the built-in footer configuration at runtime by setting
      window.FOOTER_NAV_CONFIG before popup.js executes. Since classic scripts
      block the parser and run before deferred module scripts (HTML spec §8.1.6),
      the global is guaranteed to be set when popup.js reads it.

      If footerConfig.js is absent, popup.js falls back to the DEFAULT_FOOTER_NAV_CONFIG
      exported by src/config/footer-config.js — no global variable required.
    -->
    <script src="footer-nav-config.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
