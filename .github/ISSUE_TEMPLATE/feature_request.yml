name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Bookmark Scope is intentionally local, small and permission-light. Features that need new permissions, network requests or remote services are unlikely to fit, but describing the problem helps us find another way.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation and what is hard today, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: size
    attributes:
      label: How large is your library?
      options:
        - Fewer than 500 bookmarks
        - 500 to 5,000
        - More than 5,000
        - Prefer not to say
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this request.
          required: true
        - label: I understand that features needing new permissions or network access need extra discussion.
          required: true
