name: Bug report
description: Something in Bookmark Scope does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** paste your real bookmark export or private URLs. A small reproduction with made-up bookmarks is ideal.
        For security problems, use the private link on the issue chooser instead of this form.
  - type: input
    id: version
    attributes:
      label: Bookmark Scope version
      description: Shown on chrome://extensions.
      placeholder: "5.0.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 150 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Popup
        - Dashboard
        - Settings page
        - Toolbar badge
        - Link-health scan
        - Import or export
        - Snapshot restore
        - Context menu
        - Translations or layout
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Interface language
      description: Only if the problem looks language-specific.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or diagnostics
      description: |
        Crop out private bookmarks. If you use the dashboard's diagnostic export, review the previewed JSON first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I did not include private bookmark data or personal URLs.
          required: true
